<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Jarvis Jr.</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d2d6e" />
<meta name="apple-mobile-web-app-title" content="Jarvis Jr." />
<!-- WARNING: never add the iOS "web-app-capable" meta tag here.
     It makes the home-screen icon open in standalone mode, where Apple blocks
     Web Speech: kids would see Jarvis but could never talk to him.
     Only safe to switch on AFTER Cloud STT is in place. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Nunito',sans-serif;overflow:hidden;background:#04122e;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% -10%, #1a4f9e 0%, #0d2d6e 45%, #071a3f 100%);}
  .ray{position:absolute;top:-10%;width:120px;height:130%;background:linear-gradient(180deg,rgba(120,200,255,.16),rgba(120,200,255,0));transform:rotate(8deg);filter:blur(10px);animation:sway 9s ease-in-out infinite;pointer-events:none;}
  .ray.r2{left:40%;animation-delay:-3s;opacity:.7;} .ray.r3{left:72%;animation-delay:-6s;opacity:.5;}
  @keyframes sway{0%,100%{transform:rotate(8deg) translateX(0);}50%{transform:rotate(8deg) translateX(22px);}}
  .bubble{position:absolute;bottom:-40px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8),rgba(255,255,255,.16) 60%,rgba(255,255,255,0));animation:rise linear infinite;}
  @keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0;}10%{opacity:.7;}100%{transform:translateY(-115vh) scale(1.1);opacity:0;}}

  .top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;}
  .logo{font-family:'Fredoka';font-weight:700;color:#bfe6ff;font-size:18px;display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#5fd0a8;box-shadow:0 0 10px #5fd0a8;}
  .lang{display:flex;background:rgba(255,255,255,.12);border-radius:22px;overflow:hidden;}
  .lang button{font-family:'Fredoka';font-weight:600;font-size:14px;border:none;background:transparent;color:#bfe6ff;padding:7px 16px;cursor:pointer;}
  .lang button.on{background:#4ac4e6;color:#04243a;}

  .stage{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
  .jarvis{width:min(52vmin,220px);height:min(52vmin,220px);transition:all .5s ease;will-change:transform;animation:bob 3.8s ease-in-out infinite;}
  .jarvis.buddy{position:absolute;left:16px;bottom:8px;width:78px;height:78px;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-12px) rotate(1.5deg);}}
  .jPupil{transform-origin:center;animation:blink 4.6s infinite;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}

  .creature{position:absolute;width:min(74vw,330px);height:min(74vw,330px);opacity:0;transform:translateX(70px) scale(.7);
    transition:opacity .45s ease, transform .6s cubic-bezier(.2,1.3,.4,1);display:flex;align-items:center;justify-content:center;}
  .creature.show{opacity:1;transform:translateX(0) scale(1);}
  .creature.show .art{animation:bob 3.3s ease-in-out infinite;}
  .art{width:100%;height:100%;}
  .bigemoji{font-size:min(46vw,210px);line-height:1;filter:drop-shadow(0 16px 26px rgba(0,0,0,.4));}
  .creature.show .bigemoji{animation:bob 3.3s ease-in-out infinite;}
  .talking .mouth{animation:talk .26s ease-in-out infinite alternate;transform-origin:center;}
  @keyframes talk{from{transform:scaleY(.45);}to{transform:scaleY(1.15);}}
  .wagL,.wagFast{transform-box:fill-box;transform-origin:left center;animation:wag 1.1s ease-in-out infinite;}
  .wagFast{animation-duration:.7s;}
  @keyframes wag{0%,100%{transform:rotate(-9deg);}50%{transform:rotate(11deg);}}

  .speech{position:relative;z-index:4;margin:0 16px;background:rgba(255,255,255,.97);color:#0c2747;border-radius:24px;
    padding:16px 18px;min-height:64px;max-height:30vh;overflow-y:auto;display:flex;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 12px 30px rgba(2,16,40,.45);}
  .speech::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:15px solid rgba(255,255,255,.97);}
  .speech p{font-family:'Fredoka';font-weight:600;font-size:20px;line-height:1.35;}
  .speech.idle p{color:#5b7da6;}
  .dots span{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:#7fb6e6;animation:dot 1s infinite;}
  .dots span:nth-child(2){animation-delay:.2s;} .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes dot{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-7px);opacity:1;}}

  .micwrap{z-index:4;display:flex;justify-content:center;padding:16px 0 4px;}
  .mic{width:94px;height:94px;border:none;border-radius:50%;cursor:pointer;color:#04122e;font-size:38px;
    background:radial-gradient(circle at 38% 30%,#ffe79a,#ffd24a 55%,#f3a93a);
    box-shadow:0 10px 0 #c9892b,0 0 0 10px rgba(255,210,74,.16),inset 0 4px 4px rgba(255,255,255,.6);
    transition:transform .1s ease;}
  .mic:active{transform:translateY(7px);}
  .mic.on{animation:micpulse 1.6s ease-in-out infinite;box-shadow:0 10px 0 #c9892b,0 0 0 14px rgba(95,208,168,.25),inset 0 4px 4px rgba(255,255,255,.6);}
  @keyframes micpulse{0%,100%{box-shadow:0 10px 0 #c9892b,0 0 0 12px rgba(95,208,168,.22),inset 0 4px 4px rgba(255,255,255,.6);}50%{box-shadow:0 10px 0 #c9892b,0 0 0 22px rgba(95,208,168,.05),inset 0 4px 4px rgba(255,255,255,.6);}}
  .hint{z-index:4;text-align:center;font-family:'Fredoka';font-weight:500;color:#bfe6ff;font-size:14px;padding:2px 16px 8px;min-height:22px;}

  .row{z-index:4;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:2px 16px calc(16px + env(safe-area-inset-bottom));}
  .b{font-family:'Fredoka';font-weight:700;font-size:17px;border:none;border-radius:26px;padding:15px 6px 13px;cursor:pointer;color:#062033;
    display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1;
    background-image:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 45%,rgba(0,0,0,.16));
    box-shadow:0 8px 0 rgba(0,0,0,.22),inset 0 3px 2px rgba(255,255,255,.6);transition:transform .1s ease;}
  .b:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.22),inset 0 3px 2px rgba(255,255,255,.5);}
  .b .e{font-size:30px;line-height:1;}
  .b.why{background-color:#ffd24a;} .b.wow{background-color:#ff9ec4;} .b.next{background-color:#9ec7ff;}

  .confetti{position:absolute;z-index:9;width:11px;height:15px;border-radius:2px;top:38%;pointer-events:none;}

  .diag{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,18,38,.95);color:#cfe6ff;
    font-family:'Fredoka';font-size:12px;padding:8px 12px;display:none;cursor:pointer;border-top:1px solid rgba(120,180,255,.3);}
  .diag.show{display:block;}

  .modal{position:fixed;inset:0;z-index:40;background:rgba(4,14,34,.86);display:none;align-items:center;justify-content:center;padding:24px;}
  .modal.show{display:flex;}
  .card{background:#fff;border-radius:26px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .card h2{font-family:'Fredoka';font-weight:700;color:#0c2747;font-size:22px;margin-bottom:6px;}
  .card p{font-family:'Fredoka';font-weight:500;color:#5b7da6;font-size:15px;margin-bottom:16px;}
  .card input{width:100%;font-family:'Fredoka';font-size:20px;text-align:center;padding:12px;border:2px solid #cfe0f2;border-radius:16px;color:#0c2747;margin-bottom:14px;}
  .card button{font-family:'Fredoka';font-weight:700;font-size:18px;border:none;border-radius:18px;padding:13px 26px;cursor:pointer;color:#04243a;background:#4ac4e6;box-shadow:0 6px 0 #2f9bbd;}
  #kidList{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .kid{display:flex;align-items:center;gap:10px;background:#eef5fc;border-radius:14px;padding:8px 10px;}
  .kid .tick{width:32px;height:32px;border-radius:50%;border:2px solid #4ac4e6;background:#fff;color:#4ac4e6;font-weight:800;font-size:16px;cursor:pointer;flex:0 0 auto;box-shadow:none;padding:0;}
  .kid.here .tick{background:#4ac4e6;color:#fff;}
  .kid.away{opacity:.5;}
  .kid .nm{flex:1;text-align:left;font-family:'Fredoka';font-weight:600;color:#0c2747;font-size:17px;}
  .kid .del{border:none;background:transparent;color:#d4537e;cursor:pointer;font-size:18px;box-shadow:none;padding:4px 8px;}
  .addrow{display:flex;gap:8px;margin-bottom:14px;}
  .addrow input{flex:1;margin-bottom:0;}
  .addbtn{font-family:'Fredoka';font-weight:700;font-size:15px;border:none;border-radius:14px;background:#5fd0a8;color:#04342c;padding:0 16px;cursor:pointer;box-shadow:0 4px 0 #3fa985;}
  .gear{background:rgba(255,255,255,.14);border:none;color:#bfe6ff;font-size:17px;border-radius:50%;width:36px;height:36px;cursor:pointer;margin-left:8px;}
  #app.night{background:radial-gradient(120% 80% at 50% -10%, #16234a 0%, #0a1430 45%, #050a1c 100%);}
  #app.night .ray{opacity:.12;} #app.night .bubble{opacity:.22;}
  #app.night .speech{background:rgba(228,236,255,.93);}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;}
  #app.night .star{animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.12;}50%{opacity:.95;}}
  .setrow{margin-bottom:12px;}
  .settoggle{font-family:'Fredoka';font-weight:600;font-size:15px;border:2px solid #cfe0f2;border-radius:14px;background:#fff;color:#0c2747;padding:10px 14px;width:100%;cursor:pointer;box-shadow:none;}

  /* ---- parent dashboard + grown-up gate ---- */
  .card{max-height:84vh;overflow-y:auto;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
  .stat{background:#eef5fc;border-radius:14px;padding:10px 4px;}
  .stat b{display:block;font-family:'Fredoka';font-weight:700;font-size:22px;color:#0c2747;}
  .stat span{font-family:'Fredoka';font-size:12px;color:#5b7da6;}
  .dsec{text-align:left;font-family:'Fredoka';font-weight:600;font-size:13px;color:#5b7da6;margin-top:14px;margin-bottom:2px;}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #e3edf7;}
  .fav{flex:1;text-align:left;min-width:0;}
  .fav b{display:block;font-family:'Fredoka';font-weight:600;font-size:16px;color:#0c2747;}
  .fav span{font-family:'Fredoka';font-size:13px;color:#5b7da6;}
  .pill{font-family:'Fredoka';font-weight:600;background:#dff0fa;color:#1a6f96;font-size:12px;padding:5px 10px;border-radius:11px;white-space:nowrap;}
  .words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .word{font-family:'Fredoka';background:#eef5fc;color:#0c2747;font-size:13px;padding:5px 10px;border-radius:11px;}
  .note{font-family:'Fredoka';font-size:11px;line-height:1.5;color:#9ab3cc;margin:14px 0 14px;}
  .gq{font-family:'Fredoka';font-weight:700;font-size:34px;color:#0c2747;margin-bottom:12px;}
  .card input.bad{border-color:#ff8fa8;}

  /* ---- real photo stage + safety badge + speaking cartoon ---- */
  .photo{position:absolute;inset:10px;border-radius:22px;overflow:hidden;opacity:0;transform:scale(.94);
    transition:opacity .45s ease, transform .5s cubic-bezier(.2,1.2,.4,1);box-shadow:0 14px 34px rgba(2,16,40,.5);
    background:#12417e;}
  .photo.show{opacity:1;transform:scale(1);}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;animation:breathe 6s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
  .badge{position:absolute;z-index:6;top:20px;right:20px;font-family:'Fredoka';font-weight:700;font-size:14px;
    padding:8px 14px;border-radius:16px;color:#fff;display:none;align-items:center;gap:6px;
    box-shadow:0 5px 14px rgba(0,0,0,.35);}
  .badge.on{display:flex;}
  .badge.no{background:#e24b4a;} .badge.careful{background:#e09112;} .badge.ok{background:#2f9e6d;}
  .creature.mini{width:104px;height:104px;left:auto;right:18px;bottom:18px;position:absolute;z-index:7;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));}
  .creature.mini .bigemoji{font-size:76px;}
  .photocap{position:absolute;left:14px;bottom:12px;z-index:7;font-family:'Fredoka';font-weight:600;font-size:15px;
    color:#fff;background:rgba(4,18,46,.55);padding:5px 12px;border-radius:12px;display:none;}
  .photocap.on{display:block;}

  /* ---- picture board ---- */
  .board{position:fixed;inset:0;z-index:45;background:#071a3f;display:none;flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));}
  .board.show{display:flex;}
  .btabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;flex:0 0 auto;}
  .btab{flex:0 0 auto;border:none;cursor:pointer;font-size:26px;line-height:1;padding:9px 15px;border-radius:20px;
    background:rgba(255,255,255,.12);box-shadow:none;}
  .btab.on{background:#4ac4e6;}
  .bgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:10px;padding:2px 2px 10px;align-content:start;}
  .tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;border:none;cursor:pointer;padding:0;
    background:#1a4f9e;display:flex;align-items:center;justify-content:center;font-size:40px;
    box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s ease;}
  .tile:active{transform:translateY(4px);}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .tile .tsvg{position:absolute;inset:8%;width:84%;height:84%;}
  .tile .tn{position:absolute;left:0;right:0;bottom:0;font-family:'Fredoka';font-weight:600;font-size:12px;
    color:#fff;background:linear-gradient(180deg,rgba(4,18,46,0),rgba(4,18,46,.8));padding:12px 4px 4px;}
  .tile .tb{position:absolute;top:4px;right:4px;font-size:11px;border-radius:9px;padding:1px 5px;color:#fff;}
  .tile .tb.no{background:#e24b4a;} .tile .tb.careful{background:#e09112;} .tile .tb.ok{background:#2f9e6d;}
  .bclose{flex:0 0 auto;font-family:'Fredoka';font-weight:700;font-size:19px;border:none;border-radius:22px;
    padding:14px;cursor:pointer;color:#062033;background:#ffd24a;box-shadow:0 6px 0 #c9892b;margin-top:6px;}
  .row{grid-template-columns:repeat(4,1fr);}
  .b{font-size:14px;padding:13px 2px 11px;} .b .e{font-size:26px;}
  .b.pick{background-color:#5fd0a8;}

  @media (max-height:680px){
    .jarvis{width:min(40vmin,170px);height:min(40vmin,170px);}
    .creature{width:min(56vw,250px);height:min(56vw,250px);}
    .bigemoji{font-size:min(36vw,160px);}
    .mic{width:80px;height:80px;font-size:32px;}
    .speech p{font-size:18px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div id="app">
  <div class="ray"></div><div class="ray r2"></div><div class="ray r3"></div>

  <div class="top">
    <div class="logo"><span class="dot"></span> Jarvis Jr.</div>
    <div style="display:flex;align-items:center;">
      <div class="lang">
        <button id="thBtn" class="on" onclick="setLang('th')">ไทย</button>
        <button id="enBtn" onclick="setLang('en')">EN</button>
      </div>
      <button class="gear" onclick="toggleNight()" aria-label="bedtime">🌙</button>
      <button class="gear" onclick="gearTap()" aria-label="settings">⚙️</button>
    </div>
  </div>

  <div class="stage">
    <svg class="jarvis" id="jarvis" viewBox="0 0 240 240">
      <line x1="120" y1="58" x2="120" y2="30" stroke="#7fdcec" stroke-width="7"/><circle cx="120" cy="24" r="11" fill="#ffd24a"/>
      <rect x="58" y="62" width="124" height="128" rx="40" fill="#4ac4e6"/><rect x="68" y="72" width="104" height="108" rx="32" fill="#62d2f0"/>
      <ellipse cx="44" cy="120" rx="14" ry="22" fill="#3aa9cd"/><ellipse cx="196" cy="120" rx="14" ry="22" fill="#3aa9cd"/>
      <circle cx="98" cy="118" r="26" fill="#fff"/><circle cx="142" cy="118" r="26" fill="#fff"/>
      <circle class="jPupil" cx="100" cy="122" r="12" fill="#0c2747"/><circle class="jPupil" cx="140" cy="122" r="12" fill="#0c2747"/>
      <circle cx="104" cy="116" r="4" fill="#fff"/><circle cx="144" cy="116" r="4" fill="#fff"/>
      <ellipse cx="78" cy="150" rx="13" ry="9" fill="#ff9ec4" opacity=".7"/><ellipse cx="162" cy="150" rx="13" ry="9" fill="#ff9ec4" opacity=".7"/>
      <path d="M104 150 Q120 166 136 150" stroke="#0c2747" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="photo" id="photo"></div>
    <div class="photocap" id="photocap"></div>
    <div class="badge" id="badge"></div>
    <div class="creature" id="creature"></div>
  </div>

  <div class="speech idle" id="speech"><p id="say"></p></div>
  <div class="micwrap"><button class="mic" id="mic" aria-label="Talk to Jarvis">🎤</button></div>
  <div class="hint" id="hint"></div>

  <div class="row">
    <button class="b why" onclick="onWhy()"><span class="e">❓</span><span id="lWhy">Why?</span></button>
    <button class="b wow" onclick="onWow()"><span class="e">😮</span><span id="lWow">Wow!</span></button>
    <button class="b next" onclick="onNext()"><span class="e">➡️</span><span id="lNext">Next</span></button>
    <button class="b pick" onclick="openBoard()"><span class="e">🐾</span><span id="lPick">เลือก</span></button>
  </div>

  <div class="board" id="board">
    <div class="btabs" id="btabs"></div>
    <div class="bgrid" id="bgrid"></div>
    <button class="bclose" onclick="closeBoard()" id="bCloseBtn">ปิด</button>
  </div>

  <div class="diag" id="diag" onclick="this.classList.remove('show')"></div>

  <div class="modal" id="nameModal">
    <div class="card">
      <h2 id="nmTitle">ใครจะเล่นบ้าง?</h2>
      <p id="nmSub">ใส่ชื่อลูกได้หลายคน แล้วติ๊กคนที่เล่นวันนี้</p>
      <div id="kidList"></div>
      <div class="addrow">
        <input id="nmInput" maxlength="20" placeholder="พิมพ์ชื่อ..." onkeydown="if(event.key==='Enter')addKid()" />
        <button class="addbtn" onclick="addKid()" id="nmAdd">+ เพิ่ม</button>
      </div>
      <div class="setrow"><button class="settoggle" id="sndBtn" onclick="toggleSound()">🔊 เสียงประกอบ: เปิด</button></div>
      <button onclick="doneKids()" id="nmBtn">เริ่มเล่น!</button>
    </div>
  </div>

  <div class="modal" id="gateModal">
    <div class="card">
      <h2 id="gtTitle">สำหรับผู้ใหญ่</h2>
      <p id="gtSub">ตอบคำถามนี้เพื่อเข้าหน้าพ่อแม่</p>
      <div class="gq" id="gtQ">7 + 5 = ?</div>
      <input id="gtInput" type="tel" inputmode="numeric" maxlength="3" onkeydown="if(event.key==='Enter')gateOk()" />
      <button onclick="gateOk()" id="gtBtn">เข้า</button>
      <div class="setrow" style="margin-top:12px;margin-bottom:0;"><button class="settoggle" onclick="closeGate()" id="gtCancel">ยกเลิก</button></div>
    </div>
  </div>

  <div class="modal" id="dashModal">
    <div class="card">
      <h2 id="dTitle">สำหรับคุณพ่อคุณแม่</h2>
      <p id="dashDate"></p>
      <div class="stats" id="dashStats"></div>
      <div class="dsec" id="dFavTitle">ของโปรด</div>
      <div id="dashKids"></div>
      <div class="dsec" id="dWordsTitle">คำใหม่ที่ได้เรียนรู้วันนี้</div>
      <div class="words" id="dashWords"></div>
      <p class="note" id="dNote"></p>
      <div class="setrow"><button class="settoggle" onclick="openKidsFromDash()" id="dKidsBtn">จัดการชื่อเด็ก</button></div>

    for(var oi=0;oi<ow.length;oi++) list.push([(''+ow[oi]).toLowerCase(),o,'ocean',2]); }

    for(var i=0;i<w.length;i++) list.push([(''+w[i]).toLowerCase(),k,'art',1]); }

    for(var j=0;j<arr.length;j++) list.push([(''+arr[j]).toLowerCase(),e,'emoji',0]); }
  list.sort(function(a,b){ if(b[0].length!==a[0].length) return b[0].length-a[0].length; return b[3]-a[3]; });

})();

/* ============ speech (lively voice) + anti-feedback-loop ============ */
var jarvisSpeaking=false, muteUntil=0, speakWatchdog=null, curUtter=null;
function setTalking(on){ var c=$('creature'); if(c) c.classList.toggle('talking',!!on); }
/* moods: [rate, pitch, volume] -- lets kids hear feelings, not a flat robot */
var MOOD={ excited:[1.12,1.50,1.00], playful:[1.06,1.42,1.00], happy:[1.00,1.30,1.00],
           curious:[0.96,1.22,0.95], gentle:[0.85,1.00,0.75], whisper:[0.80,0.95,0.50] };
var FUN=['excited','playful','happy','curious'];
function speak(text,mood){
  try{
    if(!('speechSynthesis' in window)){ busy=false; return; }
    if(mood===true) mood='gentle';                       // old calls: speak(x,true) == gentle
    if(!mood||!MOOD[mood]) mood='happy';
    if(nightMode && mood!=='gentle') mood='whisper';     // never shout at bedtime
    var m=MOOD[mood], base=(lang==='th')?1.0:1.05;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=(lang==='th')?'th-TH':'en-US';
    u.rate = Math.max(0.5, Math.min(1.4, m[0]*base + (Math.random()*0.08-0.04)));
    u.pitch= Math.max(0.5, Math.min(2.0, m[1] + (Math.random()*0.14-0.07)));
    u.volume=m[2];
    var vs=window.speechSynthesis.getVoices()||[];
    var want=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(lang==='th'?'th':'en')===0;});
    if(want.length){ var nice=want.find(function(v){return /kanya|google|samantha|nicky|aaron/i.test(v.name);}); u.voice=nice||want[0]; }
    jarvisSpeaking=true; setTalking(true);
    if(speakWatchdog) clearTimeout(speakWatchdog);
    var est=Math.min(12000,2200+text.length*85);
    speakWatchdog=setTimeout(function(){ jarvisSpeaking=false; muteUntil=Date.now()+300; setTalking(false); busy=false; },est);
    u.onstart=function(){ jarvisSpeaking=true; setTalking(true); };
    u.onend=function(){ if(speakWatchdog)clearTimeout(speakWatchdog); jarvisSpeaking=false; muteUntil=Date.now()+1000; setTalking(false); busy=false; };
    u.onerror=function(){ if(speakWatchdog)clearTimeout(speakWatchdog); jarvisSpeaking=false; muteUntil=Date.now()+1000; setTalking(false); busy=false; };
    curUtter=u; window.speechSynthesis.speak(u);
  }catch(e){ jarvisSpeaking=false; setTalking(false); busy=false; }
}

/* ============ render the creature ============ */
function renderVisual(kind,key,emoji,art,touch,name){
  var c=$('creature'), p=$('photo'), cap=$('photocap');
  c.classList.remove('show','mini'); p.classList.remove('show'); p.innerHTML='';
  cap.classList.remove('on'); $('badge').className='badge';

  if(svgKey && AVATARS[svgKey]){ c.innerHTML='<svg class="art" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'+AVATARS[svgKey]+'</svg>'; }
  else { c.innerHTML='<span class="bigemoji">'+(emoji||'🐾')+'</span>'; }
  void c.offsetWidth; c.classList.add('show'); sfxPop();
  $('jarvis').classList.add('buddy');
  showBadge(touch);

  // then try for a real photo; if it arrives, the cartoon steps aside and becomes the speaker
  var want=key;
  getPhoto(key,kind,function(url){
    if(!current || current.key!==want) return;        // child already moved on
    if(!url) return;                                   // no photo -> cartoon stays big. Fine.
    var img=new Image();
    img.onload=function(){
      if(!current || current.key!==want) return;
      p.innerHTML=''; p.appendChild(img); p.classList.add('show');
      c.classList.add('mini');
      if(name){ cap.textContent=name; cap.classList.add('on'); }
    };
    img.onerror=function(){};                          // broken photo -> cartoon stays. Never a blank screen.
    img.alt=name||'';
    img.src=url;
  });
}

  }

  offIdx=0; trackAnimal(key);

/* ============ Jarvis brain (Netlify function) with offline fallback ============ */
function callJarvis(userText,danger){
  var myId=++reqId; setThinking(); bumpConvo();
  if(navigator.onLine===false){ offline(); return; }   // no net -> answer instantly, don't wait to time out
  convo.push({role:'user',content:userText});
  if(convo.length>10) convo=convo.slice(-10);
  fetch("/.netlify/functions/jarvis",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages:convo, lang:lang,
      animal:(current&&current.card)?current.card:null,
      kids:hereKids().map(function(k){return k.name;})})})
  .then(function(r){return r.text().then(function(raw){var d=null;try{d=JSON.parse(raw);}catch(e){}return {ok:r.ok,status:r.status,d:d,raw:raw};});})
  .then(function(res){
    if(myId!==reqId) return;
    var text=(res.d&&res.d.text)?String(res.d.text).trim():'';
    if(res.ok&&text){ convo.push({role:'assistant',content:text}); var s=maybeName(text); showSay(s); speak(s,pick(FUN)); return; }
    offline(); 
    showDiag('Server: '+((res.d&&res.d.error)||('status '+res.status)));
  })
  .catch(function(){ if(myId!==reqId) return; offline(); });
}
function offline(){
  busy=false;
  var line='';
  if(current){
    var arr=offLines(current.key,current.name);
    if(arr&&arr.length){ line=arr[offIdx%arr.length]; offIdx++; }
    else if(current.kind==='art'){ line=(lang==='th')?ANIMALS[current.key].fillTh:ANIMALS[current.key].fillEn; }
    else { line=current.emoji+' '+current.name+'!'; }
  }
  if(!line) line=T[lang].oops;
  var s=maybeName(line); showSay(s); speak(s,pick(FUN));
}

  for(var i=0;i<list.length;i++){ var w=list[i].toLowerCase();
    if(/^[\x00-\x7F ]+$/.test(w)){ if(p.indexOf(' '+w+' ')!==-1) return true; }
    else { if(raw.indexOf(w)!==-1) return true; } } return false; }

/* ============ route what the child says ============ */
function routeSpeech(said){
  var cm=matchComfort(said); if(cm){ comfort(cm); return; }   // "I'm sad" / "miss mommy" / "scared"
  if(hitWords(BEDW,said)){ goBed(); return; }                 // "good night" -> night mode by itself
  var a=matchAnimal(said); if(a){ summon(a.key,a.kind); return; }
  if(hitWords(HELLO,said)){ sayHello(); return; }             // "Hey Jarvis" -> greet back by name
  var r=matchReply(said);
  if(r==='next'){ onNext(); return; }
  if(r==='why'){ onWhy(); return; }
  if(r==='wow'){ onWow(); return; }
  if(r==='more'){ moreFact(); return; }
  if(r==='no'){ var ok=(lang==='th')?'ได้จ้ะ!':'Okay!'; showSay(ok); speak(ok); return; }
  // an animal is on stage -> send the child's OWN words to it. This is the real conversation.
  if(current&&current.card){ if(busy) return; busy=true; callJarvis(said, current.danger); return; }
  if(current){ moreFact(); return; }            // older animals: keep telling facts
  // nothing matched and nothing on stage -> offer a favourite instead of a dead end
  var sg=favSuggest();
  var dk=sg? T[lang].tryFav(sg.label) : T[lang].dontknow;
  dk=maybeName(dk); showSay(dk); speak(dk,'curious');
}
function handleHeard(said){
  if(!said) return;
  if(jarvisSpeaking || Date.now()<muteUntil) return;
  if(!greeted){ greeted=true; }
  routeSpeech(said);
}

    said=said.trim(); if(!said) return;

  recog.onend=function(){ if(oneShot){ micOn=false; setMic(); return; } if(micOn){ setTimeout(function(){ try{recog.start();}catch(e){} },300); } };

  th:{ miss:'แม่รักหนูมากๆ นะ ❤️ เดี๋ยวแม่ก็มาหา',
       sad:'ไม่เป็นไรนะ ❤️ Jarvis อยู่ตรงนี้ ไปดูสัตว์น่ารักกันไหม?',
       scared:'ไม่ต้องกลัวนะ ❤️ มี Jarvis อยู่ด้วย ปลอดภัยจ้ะ',
       lonely:'มี Jarvis เป็นเพื่อนนะ ❤️ มาเล่นด้วยกัน!' },
  en:{ miss:'Mommy loves you so much \u2764\ufe0f She\u2019ll be back soon.',
       sad:'It\u2019s okay \u2764\ufe0f Jarvis is here. Want to see a cute animal?',
       scared:'Don\u2019t be scared \u2764\ufe0f Jarvis is right here with you.',
       lonely:'You\u2019ve got Jarvis as a friend \u2764\ufe0f Let\u2019s play together!' }
};
function matchComfort(t){ var raw=t.toLowerCase().replace(/[.,!?]/g,''); var p=' '+raw+' ';
  for(var k in COMFORT){ for(var i=0;i<COMFORT[k].length;i++){ var w=COMFORT[k][i].toLowerCase();
    if(/^[\x00-\x7F ]+$/.test(w)){ if(p.indexOf(' '+w+' ')!==-1) return k; } else { if(raw.indexOf(w)!==-1) return k; } } } return null; }
function comfort(kind){ busy=false; var line=COMFORT_LINE[lang][kind]||COMFORT_LINE[lang].sad;
  var s=maybeName(line,true); showSay(s); speak(s,true); }

/* ============ bedtime + sound toggles ============ */
function toggleNight(){ ac(); nightMode=!nightMode; $('app').classList.toggle('night',nightMode);
  var line = nightMode ? (lang==='th'?'ชู่ว์… ได้เวลานอนแล้ว มานอนสบายๆ กันนะ':'Shhh\u2026 it\u2019s bedtime. Let\u2019s get cozy.')
                       : (lang==='th'?'อรุณสวัสดิ์! มาเล่นกันต่อ!':'Good morning! Let\u2019s keep playing!');
  var s=maybeName(line,true); showSay(s); speak(s, nightMode?'whisper':'happy'); }
function toggleSound(){ soundOn=!soundOn; try{ localStorage.setItem('jarvisSound',soundOn?'1':'0'); }catch(e){} updateSndBtn(); if(soundOn){ ac(); blip(660,0.12,'triangle',0.1); } }
function updateSndBtn(){ var b=$('sndBtn'); if(!b) return;
  b.textContent=(lang==='th'?'🔊 เสียงประกอบ: ':'🔊 Sound: ')+(soundOn?(lang==='th'?'เปิด':'On'):(lang==='th'?'ปิด':'Off')); }

/* ============ confetti ============ */
function confetti(){ var cols=['#ffd24a','#ff9ec4','#5fd0a8','#9ec7ff','#ff8f7a'], host=$('app');
  for(var k=0;k<18;k++){ (function(i){ var d=document.createElement('div'); d.className='confetti';
    d.style.left=(20+Math.random()*60)+'%'; d.style.background=cols[i%cols.length]; host.appendChild(d);
    var dx=(Math.random()*180-90),dy=(240+Math.random()*180),rot=(Math.random()*540-270);
    d.animate([{transform:'rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)',opacity:0}],
      {duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.6,.3,1)'}).onfinish=function(){d.remove();}; })(k); } }

/* ============ the picture board (kids pick with their eyes, not with words) ============ */
var boardCat='ocean';
function tileTouch(key,kind){ return (kind==='ocean'&&OCEAN[key])?OCEAN[key].touch:null; }
function tileName(key,kind){
  if(kind==='ocean') return (lang==='th')?OCEAN[key].th:OCEAN[key].en;
  if(kind==='art')   return (lang==='th')?ANIMALS[key].th:ANIMALS[key].en;
  return (lang==='th')?EMOJI[key][1]:key;
}
function tileEmoji(key,kind){
  if(kind==='ocean') return OCEAN[key].emoji;
  if(kind==='art')   return ANIMALS[key].emoji;
  return EMOJI[key][0];
}
function openBoard(){ ac(); renderTabs(); renderGrid(); $('board').classList.add('show'); }
function closeBoard(){ $('board').classList.remove('show'); }
function renderTabs(){
  var box=$('btabs'); box.innerHTML='';
  CATS.forEach(function(c){
    var b=document.createElement('button');
    b.className='btab'+(c.id===boardCat?' on':'');
    b.textContent=c.icon;
    b.setAttribute('aria-label',(lang==='th')?c.th:c.en);
    b.onclick=function(){ boardCat=c.id; renderTabs(); renderGrid(); };
    box.appendChild(b);
  });
  $('bCloseBtn').textContent=T[lang].bClose;
}
function renderGrid(){
  var cat=null; for(var i=0;i<CATS.length;i++){ if(CATS[i].id===boardCat) cat=CATS[i]; }
  var g=$('bgrid'); g.innerHTML='';
  if(!cat) return;
  cat.list.forEach(function(pair){
    var key=pair[0], kind=pair[1];
    var t=document.createElement('button'); t.className='tile';
    var touch=tileTouch(key,kind), nm=tileName(key,kind);
    var inner='';
    var art=(kind==='ocean')?OCEAN[key].art:(kind==='art'?key:null);
    if(art&&AVATARS[art]) inner='<svg class="tsvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'+AVATARS[art]+'</svg>';
    else inner='<span>'+tileEmoji(key,kind)+'</span>';
    if(touch) inner+='<span class="tb '+touch+'">'+(touch==='no'?'🚫':touch==='careful'?'⚠️':'✋')+'</span>';
    inner+='<span class="tn"></span>';
    t.innerHTML=inner;
    t.querySelector('.tn').textContent=nm;
    t.onclick=function(){ closeBoard(); summon(key,kind); };
    g.appendChild(t);
    // real photo drops in behind the cartoon when it arrives
    getPhoto(key,kind,function(url){
      if(!url) return;
      var im=new Image();
      im.onload=function(){ t.insertBefore(im,t.firstChild); };
      im.alt=nm; im.src=url;
    });
  });
}

/* ============ diagnostics ============ */
function showDiag(msg){ var d=$('diag'); d.textContent='🔧 '+msg+'  (tap to close)'; d.classList.add('show'); }

/* ============ bubbles ============ */
(function(){ var host=$('app'); for(var b=0;b<16;b++){ var s=6+Math.random()*16, el=document.createElement('div'); el.className='bubble';
  el.style.width=s+'px'; el.style.height=s+'px'; el.style.left=(Math.random()*100)+'%';
  el.style.animationDuration=(7+Math.random()*8)+'s'; el.style.animationDelay=(-Math.random()*10)+'s'; host.appendChild(el); }
  for(var s2=0;s2<18;s2++){ var st=document.createElement('div'); st.className='star';
    st.style.left=(Math.random()*100)+'%'; st.style.top=(Math.random()*60)+'%';
    st.style.animationDelay=(-Math.random()*3)+'s'; host.appendChild(st); } })();

/* ============ init ============ */
$('mic').addEventListener('click',micClick);
try{ soundOn = localStorage.getItem('jarvisSound')!=='0'; }catch(e){}
kids=loadKids();
loadStats();
setLang('th');
showIdle();
renderKidList();
if(!kids.length){ $('nameModal').classList.add('show'); }
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=function(){}; }

/* ============ install as an app + work offline ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    // only reload on a REAL update, never on first install (that would loop)
    if(navigator.serviceWorker.controller){
      var refreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(refreshing) return; refreshing=true; location.reload();
      });
    }
    navigator.serviceWorker.register('sw.js')['catch'](function(e){ showDiag('SW: '+e.message); });
  });
}
/* Safety net: if this ever runs standalone on iOS the mic is dead. Say so out loud
   instead of leaving a child tapping a button that will never listen. */
if(USE_TAPTALK && navigator.standalone===true){
  flashHint(lang==='th' ? 'เปิดใน Safari นะ ไมค์ถึงจะทำงาน' : 'Open in Safari so the mic works');
  showDiag('iOS standalone: microphone is blocked by Apple. Open in Safari.');
}
</script>
